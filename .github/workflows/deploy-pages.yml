name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the official Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run so a
# published deploy always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          # Pages is static-only, so the Express API can't run here. Set a
          # repository variable REACT_APP_API_BASE (Settings > Secrets and
          # variables > Actions > Variables) to point the deployed site at a
          # hosted API. If unset, backend-dependent features show a friendly
          # "could not reach the service" message instead of breaking the page.
          REACT_APP_API_BASE: ${{ vars.REACT_APP_API_BASE }}
          # Don't fail the deploy build on lint warnings (CI gates that instead).
          CI: false
          GENERATE_SOURCEMAP: false
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
